name: code-quality

on:
  pull_request:
    branches: [main, "feat/implementation-v1"]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "test/**"
      - "ci/**"
      - "docs/**"
      - "research/**"
      - "experiment/**"
      - "chore/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.11.13

      - name: Install locked development environment
        run: uv sync --locked

      - name: Lint Python
        run: uv run ruff check src tests

      - name: Check Python formatting
        run: uv run ruff format --check src tests

      - name: Check strict types
        run: uv run mypy

      - name: Run tests with branch coverage
        run: uv run pytest

      - name: Check fixture model adapter per-file coverage
        run: uv run coverage report --include=src/mfg_agentgraph/fixture_model_adapter.py

      - name: Add coverage score to job summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: |
          echo '## Package coverage' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          echo '## Fixture model adapter coverage' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --include=src/mfg_agentgraph/fixture_model_adapter.py --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Audit workflow security
        run: uv run zizmor .github/workflows

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
